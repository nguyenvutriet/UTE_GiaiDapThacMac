<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
</head>
<body style="margin:0; padding:0; font-family:Arial, sans-serif; background-color:#f4f4f4;">

<div style="max-width:600px; margin:30px auto; background:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.1);">

    <!-- Header -->
    <div style="background:#4CAF50; padding:20px; text-align:center; color:white;">
        <h2 style="margin:0;">Xác thực tài khoản</h2>
    </div>

    <!-- Content -->
    <div style="padding:30px; text-align:center;">
        <p style="font-size:16px;">
            Xin chào <b th:text="${fullName}"></b>,
        </p>

        <p style="font-size:15px;">
            Bạn vừa yêu cầu mã xác thực OTP. Vui lòng sử dụng mã dưới đây:
        </p>

        <!-- OTP -->
        <div style="margin:20px 0;">
            <span style="display:inline-block; padding:15px 25px; font-size:28px; letter-spacing:6px; background:#f0f0f0; border-radius:8px; font-weight:bold;"
                  th:text="${otp}">
                123456
            </span>
        </div>

        <p style="font-size:14px; color:#888;">
            Mã OTP có hiệu lực trong <b>1 phút</b>.
        </p>

        <p style="font-size:14px; color:#888;">
            Nếu bạn không yêu cầu, hãy bỏ qua email này.
        </p>
    </div>

    <!-- Footer -->
    <div style="background:#f9f9f9; padding:15px; text-align:center; font-size:12px; color:#aaa;">
        © 2026 Your Company. All rights reserved.
    </div>

</div>

</body>
</html>
