<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can bo - Tao thong bao moi</title>
    <link rel="stylesheet" th:href="@{/css/staff/staff-style.css}">
    <link rel="stylesheet" th:href="@{/css/staff/staff-announcement-create.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="staff-layout">
    <aside class="sidebar">
  <link rel="icon" type="image/png" th:href="@{/images/ute_logo.png}" href="/images/ute_logo.png">
        <div class="sidebar-header">
            <img src="/images/logo_no_bg.png" class="logo" alt="logo">
        </div>

        <div class="user-profile">
            <img src="/images/staff.png" class="avatar" alt="avatar">
            <div class="user-info">
                <span class="user-role" th:text="${user.department.name}">Phong ban</span>
                <span class="user-dept">Nhan vien phong ban</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/staff/list-feedbacks}" class="nav-item"><i class="fas fa-inbox"></i> Gop y tiep nhan</a>
            <a th:href="@{/api/forum/staff}" class="nav-item"><i class="fas fa-comments"></i> Dien dan</a>
            <a th:href="@{/staff/announcement-management}" class="nav-item active"><i class="fas fa-tasks"></i> Quan ly thong bao</a>
            <a th:href="@{/staff/notifications}" class="nav-item"><i class="fas fa-bell"></i> Thong bao <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
            <a href="/staff/dashboard" class="nav-item"><i class="fas fa-chart-line"></i> Thong ke</a>
            <a href="/change-password" class="nav-item"><i class="fas fa-user-shield"></i> Doi mat khau</a>
        </nav>

        <a href="/logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Dang xuat</a>
    </aside>

    <main class="main-content">
        <section class="table-card create-wrapper">
            <div class="create-head">
                <h1>Tao thong bao moi</h1>
                <a href="/staff/announcement-management" class="back-link"><i class="fas fa-arrow-left"></i> Quay lai danh sach</a>
            </div>

            <div id="createMessage" class="create-message hidden"></div>

            <form id="createAnnouncementForm" class="create-form">
                <label for="titleInput">Tieu de thong bao</label>
                <input id="titleInput" type="text" maxlength="255" placeholder="Nhap tieu de thong bao" required>

                <label for="contentInput">Noi dung thong bao</label>
                <textarea id="contentInput" rows="10" placeholder="Nhap noi dung chi tiet" required></textarea>

                <div class="recipient-box">
                    <label>Nguoi nhan thong bao (sinh vien)</label>
                    <div class="recipient-all-row">
                        <label class="recipient-checkbox">
                            <input type="checkbox" id="allDepartmentsCheckbox">
                            <span>Tat ca cac khoa</span>
                        </label>
                    </div>

                    <div class="recipient-grid" id="departmentCheckboxes">
                        <label class="recipient-checkbox" th:each="dept : ${departments}">
                            <input type="checkbox"
                                   class="department-checkbox"
                                   th:value="${dept.id}"
                                   th:checked="${currentDepartmentId != null and currentDepartmentId == dept.id}">
                            <span th:text="${dept.name}">Khoa</span>
                        </label>
                    </div>
                </div>

                <label for="attachmentInput">Tap dinh kem (neu co)</label>
                <div id="uploadZone" class="upload-zone" role="button" tabindex="0">
                    <i class="fas fa-upload"></i>
                    <p>Chon tep hoac keo tha tep vao day de tai len</p>
                    <span>Kich thuoc toi da moi tep: 100 MB</span>
                    <button type="button" id="chooseFileBtn" class="choose-file-btn">Chon tep</button>
                </div>
                <input id="attachmentInput" type="file" multiple class="hidden-input">
                <ul id="fileList" class="file-list"></ul>

                <div class="create-actions">
                    <button id="resetBtn" type="button" class="modal-btn secondary">
                        <i class="fas fa-rotate-left"></i>
                        Lam moi
                    </button>
                    <button id="submitBtn" type="submit" class="modal-btn primary">
                        <i class="fas fa-paper-plane"></i>
                        Tao
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<script>
    const form = document.getElementById("createAnnouncementForm");
    const titleInput = document.getElementById("titleInput");
    const contentInput = document.getElementById("contentInput");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");
    const messageBox = document.getElementById("createMessage");
    const uploadZone = document.getElementById("uploadZone");
    const chooseFileBtn = document.getElementById("chooseFileBtn");
    const attachmentInput = document.getElementById("attachmentInput");
    const fileList = document.getElementById("fileList");
    const allDepartmentsCheckbox = document.getElementById("allDepartmentsCheckbox");
    const departmentCheckboxes = Array.from(document.querySelectorAll(".department-checkbox"));

    const maxFileSize = 100 * 1024 * 1024;
    let selectedFiles = [];

    function showMessage(type, text) {
        messageBox.className = `create-message ${type}`;
        messageBox.textContent = text;
    }

    function clearMessage() {
        messageBox.className = "create-message hidden";
        messageBox.textContent = "";
    }

    function resetForm() {
        form.reset();
        selectedFiles = [];
        fileList.innerHTML = "";
        syncAllDepartmentState();
        clearMessage();
    }

    function syncAllDepartmentState() {
        if (departmentCheckboxes.length === 0) {
            allDepartmentsCheckbox.checked = false;
            return;
        }

        const allChecked = departmentCheckboxes.every((checkbox) => checkbox.checked);
        allDepartmentsCheckbox.checked = allChecked;
    }

    function getSelectedDepartmentIds() {
        return departmentCheckboxes
            .filter((checkbox) => checkbox.checked)
            .map((checkbox) => checkbox.value);
    }

    function renderFiles() {
        if (selectedFiles.length === 0) {
            fileList.innerHTML = "";
            return;
        }

        fileList.innerHTML = selectedFiles.map((file, index) => {
            const sizeMb = (file.size / (1024 * 1024)).toFixed(2);
            return `
                <li>
                    <span><i class="fas fa-paperclip"></i> ${file.name} (${sizeMb} MB)</span>
                    <button type="button" class="remove-file-btn" data-index="${index}">Xoa</button>
                </li>
            `;
        }).join("");
    }

    function addFiles(files) {
        if (!files || files.length === 0) {
            return;
        }

        const tooLarge = [];
        const existingKeys = new Set(selectedFiles.map((f) => `${f.name}-${f.size}-${f.lastModified}`));

        files.forEach((file) => {
            if (!file || file.size === 0) {
                return;
            }

            if (file.size > maxFileSize) {
                tooLarge.push(file.name);
                return;
            }

            const key = `${file.name}-${file.size}-${file.lastModified}`;
            if (existingKeys.has(key)) {
                return;
            }

            existingKeys.add(key);
            selectedFiles.push(file);
        });

        renderFiles();

        if (tooLarge.length > 0) {
            showMessage("error", `Tep vuot 100MB: ${tooLarge.join(", ")}`);
        } else {
            clearMessage();
        }
    }

    uploadZone.addEventListener("click", () => {
        attachmentInput.click();
    });

    uploadZone.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            attachmentInput.click();
        }
    });

    chooseFileBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        attachmentInput.click();
    });

    attachmentInput.addEventListener("change", () => {
        addFiles(Array.from(attachmentInput.files));
        attachmentInput.value = "";
    });

    uploadZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        uploadZone.classList.add("drag-over");
    });

    uploadZone.addEventListener("dragleave", () => {
        uploadZone.classList.remove("drag-over");
    });

    uploadZone.addEventListener("drop", (event) => {
        event.preventDefault();
        uploadZone.classList.remove("drag-over");
        addFiles(Array.from(event.dataTransfer.files || []));
    });

    fileList.addEventListener("click", (event) => {
        const removeBtn = event.target.closest(".remove-file-btn");
        if (!removeBtn) {
            return;
        }

        const index = Number(removeBtn.dataset.index);
        if (!Number.isNaN(index)) {
            selectedFiles.splice(index, 1);
            renderFiles();
        }
    });

    allDepartmentsCheckbox.addEventListener("change", () => {
        const checked = allDepartmentsCheckbox.checked;
        departmentCheckboxes.forEach((checkbox) => {
            checkbox.checked = checked;
        });
    });

    departmentCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", syncAllDepartmentState);
    });

    resetBtn.addEventListener("click", resetForm);

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const selectedDepartmentIds = getSelectedDepartmentIds();

        if (!title || !content) {
            showMessage("error", "Tieu de va noi dung khong duoc de trong.");
            return;
        }

        if (!allDepartmentsCheckbox.checked && selectedDepartmentIds.length === 0) {
            showMessage("error", "Hay chon it nhat 1 khoa nhan thong bao hoac chon tat ca cac khoa.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Dang tao';

        try {
            const formData = new FormData();
            formData.append("title", title);
            formData.append("content", content);
            formData.append("allDepartments", allDepartmentsCheckbox.checked ? "true" : "false");
            selectedDepartmentIds.forEach((deptId) => formData.append("recipientDepartmentIds", deptId));
            selectedFiles.forEach((file) => formData.append("attachments", file));

            const response = await fetch("/api/announcement", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(errorText || "Khong the tao thong bao");
            }

            showMessage("success", "Tao thong bao thanh cong. Dang quay ve danh sach...");
            setTimeout(() => {
                window.location.href = "/staff/announcement-management";
            }, 800);
        } catch (error) {
            showMessage("error", error.message || "Khong the tao thong bao. Vui long thu lai.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Tao';
        }
    });

    syncAllDepartmentState();
</script>
</body>
</html>
