<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cán bộ - Thông báo</title>
    <link rel="icon" type="image/png" th:href="@{/images/ute_logo.png}" href="/images/ute_logo.png">

    <!-- CSS riêng -->
    <link rel="stylesheet" th:href="@{/css/staff/staff-notification.css}">
    <link rel="stylesheet" href="/css/staff/staff-style.css">
    <link rel="stylesheet" href="/css/staff/forumView.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div class="staff-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/images/logo_no_bg.png" class="logo">
        </div>

        <div class="user-profile">
            <img src="/images/staff.png" class="avatar">
            <div class="user-info">
                <span th:text="${#strings.replace(#strings.replace(#strings.replace(staff.department.name, 'Khoa ', ''), 'Phòng ban ', ''), 'Phòng ', '')}">Phòng ban</span>
                <span class="user-dept">Nhân viên phòng ban</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/staff/list-feedbacks" class="nav-item"><i class="fas fa-inbox"></i> Góp ý tiếp nhận</a>
            <a href="/api/forum/staff" class="nav-item"><i class="fas fa-comments"></i> Diễn đàn</a>
            <a th:href="@{/staff/announcement-management}" class="nav-item"><i class="fas fa-tasks"></i> Quản lý thông báo</a>
            <a th:href="@{/staff/notifications}" class="nav-item active"><i class="fas fa-bell"></i> Thông báo <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
            <a href="/staff/dashboard" class="nav-item"><i class="fas fa-chart-line"></i> Thống kê</a>
            <a href="/change-password" class="nav-item"><i class="fas fa-user-shield"></i> Đổi mật khẩu</a>
        </nav>

        <a href="/logout" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="main-header-top"><p class="school-title">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</p></div>

            <div class="main-header-bottom"><h1 class="page-tab">THÔNG BÁO</h1></div>

            <h1>Thông báo phòng ban</h1>
            <form method="get" th:action="@{/staff/notifications}" class="filter-form">
                <input type="hidden" name="tab" th:value="${activeTab}">
                <label class="sr-only" for="staff-filter">Loc theo trang thai doc</label>
                <select id="staff-filter" name="filter" onchange="this.form.submit()">
                    <option value="all" th:selected="${activeFilter == 'all'}">Tất cả</option>
                    <option value="read" th:selected="${activeFilter == 'read'}">Đã đọc</option>
                    <option value="unread" th:selected="${activeFilter == 'unread'}">Chưa đọc</option>
                </select>
            </form>
        </header>

        <div class="tab-row">
            <a class="tab-item" th:classappend="${activeTab == 'all'} ? ' active'"
               th:href="@{/staff/notifications(tab='all',filter=${activeFilter})}">Tất cả <span th:text="${countAll}">0</span></a>
            <a class="tab-item" th:classappend="${activeTab == 'feedback'} ? ' active'"
               th:href="@{/staff/notifications(tab='feedback',filter=${activeFilter})}">Góp ý <span th:text="${countFeedback}">0</span></a>
            <a class="tab-item" th:classappend="${activeTab == 'forum'} ? ' active'"
               th:href="@{/staff/notifications(tab='forum',filter=${activeFilter})}">Diễn đàn <span th:text="${countForum}">0</span></a>
        </div>

        <section class="notification-list" th:if="${not #lists.isEmpty(notifications)}">
            <article class="notification-item"
                     th:classappend="${item.read} ? ' read' : ' unread'"
                     th:attr="data-read-form-id='read-notification-' + ${item.id},
                              data-request-id=${item.requestId}"
                     th:each="item : ${notifications}">
                <div class="item-icon" th:classappend="${' ' + item.iconClass}" th:text="${item.icon}">!</div>
                <div class="item-content">
                    <div class="item-head">
                        <h3 th:text="${item.title}">Thông báo</h3>
                        <div class="item-actions">
                            <span th:text="${item.timeLabel}">Hôm nay</span>
                            <form method="post" th:action="@{/staff/notifications/delete}" class="delete-form"
                                  onsubmit="return confirm('Ban có chắc muốn xoá thông báo này?');">
                                <input type="hidden" name="notificationId" th:value="${item.id}">
                                <input type="hidden" name="tab" th:value="${activeTab}">
                                <input type="hidden" name="filter" th:value="${activeFilter}">
                                <button type="submit" class="delete-noti-btn" title="Xoá thông báo">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                    <p th:text="${item.content}">Nội dung thông báo</p>
                </div>
                <form method="post" th:action="@{/staff/notifications/read}" class="read-form"
                      th:id="'read-notification-' + ${item.id}">
                    <input type="hidden" name="notificationId" th:value="${item.id}">
                    <input type="hidden" name="requestId" th:value="${item.requestId}">
                    <input type="hidden" name="tab" th:value="${activeTab}">
                    <input type="hidden" name="filter" th:value="${activeFilter}">
                </form>
            </article>
        </section>

        <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">
            Không có thông báo phù hợp.
        </div>
    </main>
</div>
<script>
    function decrementUnreadBadge() {
        const badge = document.querySelector('.sidebar .badge-count');
        if (!badge) {
            return;
        }

        const current = Number.parseInt((badge.textContent || '0').trim(), 10);
        if (Number.isNaN(current)) {
            return;
        }

        const next = Math.max(current - 1, 0);
        if (next === 0) {
            badge.remove();
            return;
        }

        badge.textContent = String(next);
    }

    /**
     * Xử lý click vào notification item
     * - Đánh dấu là đã đọc
     * - Chuyển tới trang chi tiết bài viết
     */
    document.addEventListener('click', function (event) {
        // Bỏ qua nút delete
        if (event.target.closest('.delete-form, .delete-noti-btn')) {
            console.debug('[NOTI-DEBUG][STAFF] Click delete button/form -> skip redirect');
            return;
        }

        const item = event.target.closest('.notification-item[data-read-form-id]');
        if (!item) {
            console.debug('[NOTI-DEBUG][STAFF] Click outside notification item -> skip');
            return;
        }

        const wasUnread = item.classList.contains('unread');
        console.debug('[NOTI-DEBUG][STAFF] Notification clicked', {
            notificationId: item.getAttribute('data-read-form-id'),
            requestId: item.getAttribute('data-request-id')
        });

        // Đánh dấu là đã đọc
        const formId = item.getAttribute('data-read-form-id');
        const form = document.getElementById(formId);
        if (form) {
            if (wasUnread) {
                item.classList.remove('unread');
                item.classList.add('read', 'pending-read');
                decrementUnreadBadge();
            } else {
                item.classList.add('read', 'pending-read');
            }
            console.debug('[NOTI-DEBUG][STAFF] Submit read form', { formId: formId });
            form.submit();
        } else {
            console.warn('[NOTI-DEBUG][STAFF] Read form not found', { formId: formId });
        }

        // Lấy requestId từ data attribute và navigate tới trang chi tiết
        const requestId = item.getAttribute('data-request-id');
        if (requestId && requestId !== 'null' && requestId !== '') {
            console.debug('[NOTI-DEBUG][STAFF] Waiting for backend redirect to post detail', {
                targetUrl: `/api/forum/staff/${requestId}`
            });
        } else {
            console.warn('[NOTI-DEBUG][STAFF] Missing requestId -> cannot redirect', {
                requestId: requestId,
                html: item.outerHTML
            });
        }
    });
</script>
</body>
</html>
