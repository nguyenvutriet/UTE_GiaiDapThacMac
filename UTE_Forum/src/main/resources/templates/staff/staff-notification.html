<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - Thong bao</title>
    <link rel="stylesheet" th:href="@{/css/layout/dashboard-common.css}">
    <link rel="stylesheet" th:href="@{/css/staff/staff-notification.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="staff-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <img th:src="@{/images/logo_no_bg.png}" class="logo" alt="logo">
        </div>

        <div class="user-profile">
            <img th:src="@{/images/staff.png}" class="avatar" alt="avatar">
            <div class="user-info">
                <span class="user-role" th:text="${staff != null ? staff.fullName : 'Cán bộ Thanh tra'}">Cán bộ Thanh tra</span>
                <span class="user-dept">Nhân viên phòng ban</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/staff/list-feedbacks}" class="nav-item"><i class="fas fa-box-archive"></i> Góp ý tiếp nhận</a>
            <a th:href="@{/staff/forum}" class="nav-item"><i class="fas fa-comments"></i> Diễn đàn</a>
            <a th:href="@{/staff/forum/notification-management}" class="nav-item"><i class="fas fa-list-check"></i> Quản lý thông báo</a>
            <a th:href="@{/staff/notifications}" class="nav-item active">
                <i class="fas fa-bell"></i> Thông báo
                <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span>
            </a>
            <a href="#" class="nav-item"><i class="fas fa-chart-line"></i> Thống kê</a>
            <a th:href="@{/change-password}" class="nav-item"><i class="fas fa-key"></i> Đổi mật khẩu</a>
        </nav>

        <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-right-from-bracket"></i> Đăng xuất</a>
    </aside>

    <main class="main-content">
        <header class="page-head">
            <h1>Thong bao phong ban</h1>
            <form method="get" th:action="@{/staff/notifications}" class="filter-form">
                <input type="hidden" name="tab" th:value="${activeTab}">
                <label class="sr-only" for="staff-filter">Loc theo trang thai doc</label>
                <select id="staff-filter" name="filter" onchange="this.form.submit()">
                    <option value="all" th:selected="${activeFilter == 'all'}">Tat ca</option>
                    <option value="read" th:selected="${activeFilter == 'read'}">Da doc</option>
                    <option value="unread" th:selected="${activeFilter == 'unread'}">Chua doc</option>
                </select>
            </form>
        </header>

        <div class="tab-row">
            <a class="tab-item" th:classappend="${activeTab == 'all'} ? ' active'"
               th:href="@{/staff/notifications(tab='all',filter=${activeFilter})}">Tat ca <span th:text="${countAll}">0</span></a>
            <a class="tab-item" th:classappend="${activeTab == 'feedback'} ? ' active'"
               th:href="@{/staff/notifications(tab='feedback',filter=${activeFilter})}">Gop y <span th:text="${countFeedback}">0</span></a>
            <a class="tab-item" th:classappend="${activeTab == 'forum'} ? ' active'"
               th:href="@{/staff/notifications(tab='forum',filter=${activeFilter})}">Dien dan <span th:text="${countForum}">0</span></a>
        </div>

        <section class="notification-list" th:if="${not #lists.isEmpty(notifications)}">
            <a class="notification-link" th:href="@{/staff/notifications/{id}(id=${item.id})}" th:each="item : ${notifications}">
                <article class="notification-item" th:classappend="${item.read} ? ' read' : ' unread'">
                    <div class="item-icon" th:classappend="${' ' + item.iconClass}" th:text="${item.icon}">!</div>
                    <div class="item-content">
                        <div class="item-head">
                            <h3 th:text="${item.title}">Thong bao</h3>
                            <span th:text="${item.timeLabel}">hom nay</span>
                        </div>
                        <p th:text="${item.content}">Noi dung thong bao</p>
                    </div>
                </article>
            </a>
        </section>

        <div class="empty-state" th:if="${#lists.isEmpty(notifications)}">
            Khong co thong bao phu hop.
        </div>
    </main>
</div>
</body>
</html>
