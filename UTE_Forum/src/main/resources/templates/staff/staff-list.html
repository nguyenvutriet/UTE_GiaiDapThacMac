<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cán bộ - Quản lý góp ý</title>

    <!-- CSS riêng -->
    <link rel="stylesheet" href="/css/staff/staff-style.css">


    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div class="staff-layout">
  <link rel="icon" type="image/png" th:href="@{/images/ute_logo.png}" href="/images/ute_logo.png">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/images/logo_no_bg.png" class="logo">
        </div>

        <div class="user-profile">
            <img src="/images/staff.png" class="avatar">
            <div class="user-info">
                <span th:text="${currentUser.department.name}"></span>
                <span class="user-dept">Nhân viên phòng ban</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active"><i class="fas fa-inbox"></i> Góp ý tiếp nhận</a>
            <a th:href="@{/api/forum/staff}" class="nav-item">
                <i class="fas fa-comments"></i> Diễn đàn
            </a>
            <a th:href="@{/staff/announcement-management}" class="nav-item"><i class="fas fa-tasks"></i> Quản lý thông báo</a>
            <a th:href="@{/staff/notifications}" class="nav-item"><i class="fas fa-bell"></i> Thông báo <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
            <a href="#" class="nav-item"><i class="fas fa-chart-line"></i> Thống kê</a>
            <a href="/change-password" class="nav-item"><i class="fas fa-user-shield"></i> Đổi mật khẩu</a>
        </nav>

        <a href="/logout" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
        <div class="table-card">

            <div class="toolbar">
                <form th:action="@{/staff/search-feedbacks}" method="get">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" name="keyword"
                               placeholder="Tìm kiếm theo tiêu đề..."
                               onkeydown="if(event.key==='Enter'){this.form.submit();}">
                    </div>
                </form>

                <div>
                    <button class="filter-btn">
                        <i class="fas fa-filter"></i> Trạng thái
                    </button>

                    <div class="filter-dropdown">

                        <button class="filter-btn" id="categoryBtn" onclick="toggleDropdown()">
                            <i class="fas fa-th-large"></i>
                            <span th:text="${selectedCategoryName != null ? selectedCategoryName : 'Danh mục'}"></span>
                        </button>

                        <div class="dropdown-menu" id="categoryDropdown">

                            <!-- 🔍 SEARCH -->
                            <div class="dropdown-search">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text"
                                       id="categorySearch"
                                       placeholder="Tìm danh mục..."
                                       onkeyup="filterCategoryList(event)">
                            </div>

                            <!-- default -->
                            <div class="dropdown-item category-item"
                                 data-id="ALL"
                                 data-name="Danh mục"
                                 th:classappend="${selectedCategory == null} ? ' selected'"
                                 onclick="filterCategory(this)">
                                Danh mục
                            </div>

                            <!-- list -->
                            <div th:each="c : ${categories}"
                                 class="dropdown-item category-item"
                                 th:text="${c.subject}"
                                 th:attr="data-name=${c.subject}, data-id=${c.id}"
                                 th:classappend="${c.id == selectedCategory} ? ' selected'"
                                 onclick="filterCategory(this)">
                            </div>

                        </div>

                    </div>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="staff-table">
                    <thead>
                    <tr>
                        <th><i class="fas fa-align-left"></i> TIÊU ĐỀ</th>
                        <th><i class="fas fa-layer-group"></i> DANH MỤC</th>
                        <th>
                            <a th:href="@{/staff/list-feedbacks(page=${currentPage}, sortField='currentStatus', sortDir=${sortDir == 'ASC' ? 'DESC' : 'ASC'})}"
                               class="sort-link">

                                <i class="fas fa-spinner"></i> TRẠNG THÁI

                                <!-- ICON -->
                                <i th:if="${sortField == 'currentStatus' and sortDir == 'ASC'}"
                                   class="fas fa-arrow-up"></i>

                                <i th:if="${sortField == 'currentStatus' and sortDir == 'DESC'}"
                                   class="fas fa-arrow-down"></i>

                            </a>
                        </th>
                        <th><i class="fas fa-user"></i> NGƯỜI GỬI</th>
                        <th><i class="fas fa-clock"></i> NGÀY GỬI</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fb : ${feedbacks}">

                        <!-- TIÊU ĐỀ -->
                        <td class="title-cell">
                            <a th:href="@{/staff/feedback-detail(id=${fb.id})}"
                               class="title-link"
                               th:text="${fb.subject}">
                            </a>
                        </td>

                        <!-- DANH MỤC -->
                        <td th:text="${fb.categories != null ? #strings.listJoin(fb.categories.![subject], ', ') : ''}"></td>

                        <!-- TRẠNG THÁI -->
                        <td>
                            <span class="status-tag"
                                  th:classappend="
                                    ${fb.currentStatus == 'PENDING'} ? ' pending' :
                                    (${fb.currentStatus == 'APPROVED'} ? ' processing' :
                                    (${fb.currentStatus == 'RESOLVED'} ? ' success' :
                                    (${fb.currentStatus == 'FORWARDING'} ? ' forwarding' :
                                    (${fb.currentStatus == 'REJECTED'} ? ' rejected' : ''))))
                                  ">

                                <i th:if="${fb.currentStatus == 'PENDING'}" class="fas fa-exclamation-circle"></i>
                                <i th:if="${fb.currentStatus == 'APPROVED'}" class="fas fa-spinner fa-spin"></i>
                                <i th:if="${fb.currentStatus == 'RESOLVED'}" class="fas fa-check-circle"></i>
                                <i th:if="${fb.currentStatus == 'FORWARDING'}" class="fas fa-share"></i>
                                <i th:if="${fb.currentStatus == 'REJECTED'}" class="fas fa-ban"></i>

                                <span th:text="
                                    ${fb.currentStatus == 'PENDING'} ? 'Đang chờ tiếp nhận' :
                                    (${fb.currentStatus == 'APPROVED'} ? 'Đang xử lý' :
                                    (${fb.currentStatus == 'RESOLVED'} ? 'Đã xử lý' :
                                    (${fb.currentStatus == 'FORWARDING'} ? 'Được chuyển tiếp' :
                                    (${fb.currentStatus == 'REJECTED'} ? 'Từ chối' : ''))))
                                "></span>

                            </span>
                        </td>

                        <!-- NGƯỜI GỬI -->
                        <td th:text="${fb.user != null ? fb.user.fullName : 'Ẩn danh'}"></td>

                        <!-- NGÀY GỬI -->
                        <td th:text="${#temporals.format(fb.timeCreate, 'HH:mm:ss dd/MM/yyyy')}"></td>

                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">

                <!-- PREV -->
                <a th:href="${currentPage == 0} ? '#' : @{/staff/list-feedbacks(page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0} ? ' disabled'"
                   class="p-btn">
                    <i class="fas fa-chevron-left"></i>
                </a>

                <!-- TEXT -->
                <span class="page-info">
    Trang <span th:text="${currentPage + 1}"></span> /
    <span th:text="${totalPages}"></span>
</span>

                <!-- NEXT -->
                <a th:href="${currentPage + 1 >= totalPages} ? '#' : @{/staff/list-feedbacks(page=${currentPage + 1})}"
                   th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'"
                   class="p-btn">
                    <i class="fas fa-chevron-right"></i>
                </a>

            </div>
        </div>
    </main>

</div>
<script>
    function toggleDropdown() {
        const dropdown = document.getElementById("categoryDropdown");
        dropdown.classList.toggle("show");

        if (dropdown.classList.contains("show")) {
            document.getElementById("categorySearch").value = "";
            filterCategoryList();
        }
    }

    function filterCategory(el) {
        const id = el.getAttribute("data-id");
        const name = el.getAttribute("data-name") || "Danh mục";

        // 🔥 đổi text nút
        document.getElementById("categoryBtn").innerHTML =
            '<i class="fas fa-th-large"></i> ' + name;

        // 🔥 xử lý chuyển trang
        if (!id || id === "ALL") {
            window.location.href = window.location.origin + '/staff/list-feedbacks';
        } else {
            window.location.href = '/staff/filter-feedbacks?categoryId=' + id;
        }
    }
</script>
<script>
    document.addEventListener("click", function(e) {
        const dropdown = document.getElementById("categoryDropdown");
        const button = document.getElementById("categoryBtn");

        if (!dropdown.contains(e.target) && !button.contains(e.target)) {
            dropdown.classList.remove("show");
        }
    });
</script>
<script>
    function filterCategoryList(event) {
        const keyword = document
            .getElementById("categorySearch")
            .value;

        const items = document.querySelectorAll(".category-item");

        items.forEach(item => {
            const text = item.getAttribute("data-name");

            if (!text) return;

            const textNormalized = removeVietnameseTones(text);
            const keywordNormalized = removeVietnameseTones(keyword);

            if (textNormalized.includes(keywordNormalized)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });

        // ENTER
        if (event && event.key === "Enter") {
            event.preventDefault();

            if (!keyword) {
                window.location.href = "/staff/list-feedbacks";
                return;
            }

            const firstVisible = document.querySelector(
                "#categoryDropdown .category-item:not([style*='display: none']):not([data-id='ALL'])"
            );

            if (firstVisible) {
                const id = firstVisible.getAttribute("data-id");
                window.location.href =
                    "/staff/filter-feedbacks?categoryId=" + id;
            }
        }
    }

    function removeVietnameseTones(str) {
        return str
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d")
            .replace(/Đ/g, "D")
            .toLowerCase();
    }
</script>
</body>
</html>
