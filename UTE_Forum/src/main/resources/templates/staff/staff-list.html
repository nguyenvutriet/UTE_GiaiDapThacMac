<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cán bộ - Quản lý góp ý</title>

    <!-- CSS riêng -->
    <link rel="stylesheet" href="/css/staff/staff-style.css">

    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div class="staff-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/images/logo_no_bg.png" class="logo">
        </div>

        <div class="user-profile">
            <img src="/images/staff.png" class="avatar">
            <div class="user-info">
                <span th:text="${staff.department.name}"></span>
                <span class="user-dept">Nhân viên phòng ban</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active"><i class="fas fa-inbox"></i> Góp ý tiếp nhận</a>
            <a href="#" class="nav-item"><i class="fas fa-comments"></i> Diễn đàn</a>
            <a href="#" class="nav-item"><i class="fas fa-tasks"></i> Quản lý thông báo</a>
            <a th:href="@{/staff/notifications}" class="nav-item"><i class="fas fa-bell"></i> Thông báo <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
            <a href="#" class="nav-item"><i class="fas fa-chart-line"></i> Thống kê</a>
            <a href="/change-password" class="nav-item"><i class="fas fa-user-shield"></i> Đổi mật khẩu</a>
        </nav>

        <a href="/logout" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
        <div class="table-card">

            <div class="toolbar">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Tìm kiếm theo tiêu đề...">
                </div>

                <div>
                    <button class="filter-btn">
                        <i class="fas fa-filter"></i> Trạng thái
                    </button>

                    <button class="filter-btn">
                        <i class="fas fa-th-large"></i> Danh mục
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="staff-table">
                    <thead>
                    <tr>
                        <th><i class="fas fa-align-left"></i> TIÊU ĐỀ</th>
                        <th><i class="fas fa-layer-group"></i> DANH MỤC</th>
                        <th>
                            <a th:href="@{/staff/list-feedbacks(
            page=${currentPage},
            sortField='currentStatus',
            sortDir=${sortDir == 'ASC' ? 'DESC' : 'ASC'}
        )}"
                               class="sort-link">

                                <i class="fas fa-spinner"></i> TRẠNG THÁI

                                <!-- ICON -->
                                <i th:if="${sortField == 'currentStatus' and sortDir == 'ASC'}"
                                   class="fas fa-arrow-up"></i>

                                <i th:if="${sortField == 'currentStatus' and sortDir == 'DESC'}"
                                   class="fas fa-arrow-down"></i>

                            </a>
                        </th>
                        <th><i class="fas fa-user"></i> NGƯỜI GỬI</th>
                        <th><i class="fas fa-clock"></i> NGÀY GỬI</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fb : ${feedbacks}">

                        <!-- TIÊU ĐỀ -->
                        <td class="title-cell" th:text="${fb.subject}"></td>

                        <!-- DANH MỤC -->
                        <td th:text="${#strings.listJoin(fb.categories, ', ')}"></td>

                        <!-- TRẠNG THÁI -->
                        <td>
                            <span class="status-tag"
                                  th:classappend="
                                    ${fb.status == 'RESOLVED'} ? ' success' :
                                    (${fb.status == 'PENDING'} ? ' pending' :
                                    (${fb.status == 'FORWARDING'} ? ' forwarding' :
                                    (${fb.status == 'REJECTED'} ? 'rejected' : '')))
                                  ">

                                <!-- ICON -->
                                <i th:if="${fb.status == 'RESOLVED'}" class="fas fa-check-circle"></i>
                                <i th:if="${fb.status == 'PENDING'}" class="fas fa-spinner"></i>
                                <i th:if="${fb.status == 'FORWARDING'}" class="fas fa-arrow-right"></i>
                                <i th:if="${fb.status == 'REJECTED'}" class="fas fa-ban"></i>

                                <!-- TEXT -->
                                <span th:text="
                                    ${fb.status == 'RESOLVED'} ? 'Đã xử lý' :
                                    (${fb.status == 'PENDING'} ? 'Đang xử lý' :
                                    (${fb.status == 'FORWARDING'} ? 'Được chuyển tiếp' :
                                    (${fb.status == 'REJECTED'} ? ' Từ chỗi' : '')))
                                "></span>

                            </span>
                        </td>

                        <!-- NGƯỜI GỬI -->
                        <td th:text="${fb.userName}"></td>

                        <!-- NGÀY GỬI -->
                        <td th:text="${#temporals.format(fb.date, 'HH:mm:ss dd/MM/yyyy')}"></td>

                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">

                <!-- PREV -->
                <a th:href="${currentPage == 0} ? '#' : @{/staff/list-feedbacks(page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0} ? ' disabled'"
                   class="p-btn">
                    <i class="fas fa-chevron-left"></i>
                </a>

                <!-- TEXT -->
                <span class="page-info">
                    Trang <span th:text="${currentPage + 1}"></span> /
                    <span th:text="${totalPages}"></span>
                </span>
                <!-- NEXT -->
                <a th:href="${currentPage + 1 >= totalPages} ? '#' : @{/staff/list-feedbacks(page=${currentPage + 1})}"
                   th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'"
                   class="p-btn">
                    <i class="fas fa-chevron-right"></i>
                </a>

            </div>
    </main>

</div>
</body>
</html>
