<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cán bộ - Quản lý góp ý</title>

    <!-- CSS riêng -->
    <link rel="stylesheet" href="/css/staff/staff-style.css">


    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div class="staff-layout">
  <link rel="icon" type="image/png" th:href="@{/images/ute_logo.png}" href="/images/ute_logo.png">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/images/logo_no_bg.png" class="logo">
        </div>

        <div class="user-profile">
            <img src="/images/staff.png" class="avatar">
            <div class="user-info">
                <span th:text="${#strings.replace(#strings.replace(#strings.replace(currentUser.department.name, 'Khoa ', ''), 'Phòng ban ', ''), 'Phòng ', '')}"></span>
                <span class="user-dept">Nhân viên phòng ban</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active"><i class="fas fa-inbox"></i> Góp ý tiếp nhận</a>
            <a th:href="@{/api/forum/staff}" class="nav-item">
                <i class="fas fa-comments"></i> Diễn đàn
            </a>
            <a th:href="@{/staff/announcement-management}" class="nav-item"><i class="fas fa-tasks"></i> Quản lý thông báo</a>
            <a th:href="@{/staff/notifications}" class="nav-item"><i class="fas fa-bell"></i> Thông báo <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
            <a href="/staff/dashboard" class="nav-item"><i class="fas fa-chart-line"></i> Thống kê</a>
            <a href="/change-password" class="nav-item"><i class="fas fa-user-shield"></i> Đổi mật khẩu</a>
        </nav>

        <a href="/logout" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </a>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
        <div class="table-card">

            <div class="toolbar">
                <form th:action="@{/staff/search-feedbacks}" method="get">

                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" name="keyword"
                               placeholder="Tìm kiếm theo tiêu đề..."
                               onkeydown="if(event.key==='Enter'){this.form.submit();}">
                    </div>

                    <!-- 🔥 GIỮ FILTER -->
                </form>

                <div>
                    <div class="filter-dropdown">

                        <button class="filter-btn" id="statusBtn" onclick="toggleStatusDropdown(event)">
                            <i class="fas fa-filter"></i>
                            <span th:text="${selectedStatusName != null ? selectedStatusName : 'Trạng thái'}"></span>
                        </button>

                        <div class="dropdown-menu" id="statusDropdown">

                            <!-- SEARCH -->
                            <div class="dropdown-search">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text"
                                       id="statusSearch"
                                       placeholder="Tìm trạng thái..."
                                       onkeyup="filterStatusList(event)">
                            </div>

                            <!-- ALL -->
                            <div class="dropdown-item status-item"
                                 data-id="ALL"
                                 data-name="Trạng thái"
                                 th:classappend="${selectedStatus == null} ? ' selected'"
                                 onclick="filterStatus(this)">
                                Trạng thái
                            </div>

                            <!-- LIST -->
                            <div class="dropdown-item status-item"
                                 data-id="PENDING"
                                 data-name="Đang chờ tiếp nhận"
                                 th:classappend="${selectedStatus == 'PENDING'} ? ' selected'"
                                 onclick="filterStatus(this)">
                                Đang chờ tiếp nhận
                            </div>

                            <div class="dropdown-item status-item"
                                 data-id="APPROVED"
                                 data-name="Đang xử lý"
                                 th:classappend="${selectedStatus == 'APPROVED'} ? ' selected'"
                                 onclick="filterStatus(this)">
                                Đang xử lý
                            </div>

                            <div class="dropdown-item status-item"
                                 data-id="RESOLVED"
                                 data-name="Đã xử lý"
                                 th:classappend="${selectedStatus == 'RESOLVED'} ? ' selected'"
                                 onclick="filterStatus(this)">
                                Đã xử lý
                            </div>

                            <div class="dropdown-item status-item"
                                 data-id="FORWARDING"
                                 data-name="Chuyển tiếp"
                                 th:classappend="${selectedStatus == 'FORWARDING'} ? ' selected'"
                                 onclick="filterStatus(this)">
                                Chuyển tiếp
                            </div>

                            <div class="dropdown-item status-item"
                                 data-id="REJECTED"
                                 data-name="Từ chối"
                                 th:classappend="${selectedStatus == 'REJECTED'} ? ' selected'"
                                 onclick="filterStatus(this)">
                                Từ chối
                            </div>

                        </div>
                    </div>

                    <div class="filter-dropdown">

                        <button class="filter-btn" id="categoryBtn" onclick="toggleDropdown(event)">
                            <i class="fas fa-th-large"></i>
                            <span th:text="${selectedCategoryName != null ? selectedCategoryName : 'Danh mục'}"></span>
                        </button>

                        <div class="dropdown-menu" id="categoryDropdown">

                            <!-- 🔍 SEARCH -->
                            <div class="dropdown-search">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text"
                                       id="categorySearch"
                                       placeholder="Tìm danh mục..."
                                       onkeyup="filterCategoryList(event)">
                            </div>

                            <!-- default -->
                            <div class="dropdown-item category-item"
                                 data-id="ALL"
                                 data-name="Danh mục"
                                 th:classappend="${selectedCategory == null} ? ' selected'"
                                 onclick="filterCategory(this)">
                                Danh mục
                            </div>

                            <!-- list -->
                            <div th:each="c : ${categories}"
                                 class="dropdown-item category-item"
                                 th:text="${c.subject}"
                                 th:attr="data-name=${c.subject}, data-id=${c.id}"
                                 th:classappend="${c.id == selectedCategory} ? ' selected'"
                                 onclick="filterCategory(this)">
                            </div>

                        </div>

                    </div>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="staff-table">
                    <thead>
                    <tr>
                        <th><i class="fas fa-align-left"></i> TIÊU ĐỀ</th>
                        <th><i class="fas fa-layer-group"></i> DANH MỤC</th>
                        <th>
                            <a th:href="@{/staff/list-feedbacks(page=${currentPage}, sortField='currentStatus', sortDir=${sortDir == 'ASC' ? 'DESC' : 'ASC'})}"
                               class="sort-link">

                                <i class="fas fa-spinner"></i> TRẠNG THÁI

                                <!-- ICON -->
                                <i th:if="${sortField == 'currentStatus' and sortDir == 'ASC'}"
                                   class="fas fa-arrow-up"></i>

                                <i th:if="${sortField == 'currentStatus' and sortDir == 'DESC'}"
                                   class="fas fa-arrow-down"></i>

                            </a>
                        </th>
                        <th><i class="fas fa-user"></i> NGƯỜI GỬI</th>
                        <th>
                            <a th:href="@{/staff/list-feedbacks(
                                page=${currentPage},
                                sortField='timeCreate',
                                sortDir=${sortDir == 'ASC' ? 'DESC' : 'ASC'}
                            )}"
                               class="sort-link">

                                <i class="fas fa-clock"></i>
                                NGÀY GỬI
                                <!-- 🔥 ICON ĐỘNG -->
                                <i th:if="${sortField == 'timeCreate' and sortDir == 'ASC'}"
                                   class="fas fa-arrow-up"></i>

                                <i th:if="${sortField == 'timeCreate' and sortDir == 'DESC'}"
                                   class="fas fa-arrow-down"></i>

                            </a>
                        </th>
                    </tr>
                    </thead>
                    <tbody id="loadingRow">
                    <tr>
                        <td colspan="5">
                            <div class="loading-box">
                                <div class="spinner"></div>
                                <p>Đang tải dữ liệu...</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tbody id="tableBody" style="display: none;">
                    <tr th:each="fb : ${feedbacks}">

                        <!-- TIÊU ĐỀ -->
                        <td class="title-cell">
                            <a th:href="@{/staff/feedback-detail(id=${fb.id})}"
                               class="title-link"
                               th:text="${fb.subject}">
                            </a>
                        </td>

                        <!-- DANH MỤC -->
                        <td th:text="${fb.categories != null ? #strings.listJoin(fb.categories.![subject], ', ') : ''}"></td>

                        <!-- TRẠNG THÁI -->
                        <td>
                            <span class="status-tag"
                                  th:classappend="
                                    ${fb.currentStatus == 'PENDING'} ? ' pending' :
                                    (${fb.currentStatus == 'APPROVED'} ? ' processing' :
                                    (${fb.currentStatus == 'RESOLVED'} ? ' success' :
                                    (${fb.currentStatus == 'FORWARDING'} ? ' forwarding' :
                                    (${fb.currentStatus == 'REJECTED'} ? ' rejected' : ''))))
                                  ">

                                <i th:if="${fb.currentStatus == 'PENDING'}" class="fas fa-exclamation-circle"></i>
                                <i th:if="${fb.currentStatus == 'APPROVED'}" class="fas fa-spinner fa-spin"></i>
                                <i th:if="${fb.currentStatus == 'RESOLVED'}" class="fas fa-check-circle"></i>
                                <i th:if="${fb.currentStatus == 'FORWARDING'}" class="fas fa-share"></i>
                                <i th:if="${fb.currentStatus == 'REJECTED'}" class="fas fa-ban"></i>

                                <span th:text="
                                    ${fb.currentStatus == 'PENDING'} ? 'Đang chờ tiếp nhận' :
                                    (${fb.currentStatus == 'APPROVED'} ? 'Đang xử lý' :
                                    (${fb.currentStatus == 'RESOLVED'} ? 'Đã xử lý' :
                                    (${fb.currentStatus == 'FORWARDING'} ? 'Được chuyển tiếp' :
                                    (${fb.currentStatus == 'REJECTED'} ? 'Từ chối' : ''))))
                                "></span>

                            </span>
                        </td>

                        <!-- NGƯỜI GỬI -->
                        <td th:text="${fb.postStatus == 'PRIVATE' ? 'Ẩn danh' : (fb.user != null ? fb.user.fullName : 'Ẩn danh')}"></td>

                        <!-- NGÀY GỬI -->
                        <td th:text="${#temporals.format(fb.timeCreate, 'HH:mm:ss dd/MM/yyyy')}"></td>

                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">

                <!-- PREV -->
                <a th:href="${currentPage == 0} ? '#' : @{/staff/list-feedbacks(page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0} ? ' disabled'"
                   class="p-btn">
                    <i class="fas fa-chevron-left"></i>
                </a>

                <!-- TEXT -->
                <span class="page-info">
    Trang <span th:text="${currentPage + 1}"></span> /
    <span th:text="${totalPages}"></span>
</span>

                <!-- NEXT -->
                <a th:href="${currentPage + 1 >= totalPages} ? '#' : @{/staff/list-feedbacks(page=${currentPage + 1})}"
                   th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'"
                   class="p-btn">
                    <i class="fas fa-chevron-right"></i>
                </a>

            </div>
        </div>
    </main>

</div>
<script>
    function toggleDropdown(event) {
        event.stopPropagation(); // 🔥 NGĂN BUBBLE

        const dropdown = document.getElementById("categoryDropdown");
        const statusDropdown = document.getElementById("statusDropdown");

        dropdown.classList.toggle("show");
        statusDropdown.classList.remove("show"); // 🔥 đóng cái kia

        if (dropdown.classList.contains("show")) {
            document.getElementById("categorySearch").value = "";
            filterCategoryList();
        }
    }

    function filterCategory(el) {
        const id = el.getAttribute("data-id");
        const name = el.getAttribute("data-name") || "Danh mục";

        document.getElementById("categoryBtn").innerHTML =
            '<i class="fas fa-th-large"></i> ' + name;

        const current = new URL(window.location.href);
        const url = new URL(window.location.origin + "/staff/filter-feedbacks");

        const status = current.searchParams.get("status");

        if (status) {
            url.searchParams.set("status", status);
        }

        if (!id || id === "ALL") {
            url.searchParams.delete("categoryId");
        } else {
            url.searchParams.set("categoryId", id);
        }

        window.location.href = url.toString();
    }
</script>
<script>
    document.addEventListener("click", function(e) {

        const categoryDropdown = document.getElementById("categoryDropdown");
        const categoryBtn = document.getElementById("categoryBtn");

        const statusDropdown = document.getElementById("statusDropdown");
        const statusBtn = document.getElementById("statusBtn");

        if (!categoryDropdown.contains(e.target) && !categoryBtn.contains(e.target)) {
            categoryDropdown.classList.remove("show");
        }

        if (!statusDropdown.contains(e.target) && !statusBtn.contains(e.target)) {
            statusDropdown.classList.remove("show");
        }

    });
</script>
<script>
    function filterCategoryList(event) {
        const keyword = document
            .getElementById("categorySearch")
            .value;

        const items = document.querySelectorAll(".category-item");

        items.forEach(item => {
            const text = item.getAttribute("data-name");

            if (!text) return;

            const textNormalized = removeVietnameseTones(text);
            const keywordNormalized = removeVietnameseTones(keyword);

            if (textNormalized.includes(keywordNormalized)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });

        // ENTER
        if (event && event.key === "Enter") {
            event.preventDefault();

            if (!keyword) {
                window.location.href = "/staff/list-feedbacks";
                return;
            }

            const firstVisible = document.querySelector(
                "#categoryDropdown .category-item:not([style*='display: none']):not([data-id='ALL'])"
            );

            if (firstVisible) {
                const id = firstVisible.getAttribute("data-id");
                const current = new URL(window.location.href);
                const status = current.searchParams.get("status");

                let url = "/staff/filter-feedbacks?categoryId=" + id;

                if (status) {
                    url += "&status=" + status;
                }

                window.location.href = url;
            }
        }
    }

    function removeVietnameseTones(str) {
        return str
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d")
            .replace(/Đ/g, "D")
            .toLowerCase();
    }
    function toggleStatusDropdown(event) {
        event.stopPropagation(); // 🔥 NGĂN BUBBLE

        const dropdown = document.getElementById("statusDropdown");
        const categoryDropdown = document.getElementById("categoryDropdown");

        dropdown.classList.toggle("show");
        categoryDropdown.classList.remove("show"); // 🔥 đóng cái kia

        if (dropdown.classList.contains("show")) {
            document.getElementById("statusSearch").value = "";
            filterStatusList();
        }
    }
    function filterStatus(el) {
        const id = el.getAttribute("data-id");
        const name = el.getAttribute("data-name");

        document.getElementById("statusBtn").innerHTML =
            '<i class="fas fa-filter"></i> ' + name;

        const current = new URL(window.location.href);
        const url = new URL(window.location.origin + "/staff/filter-feedbacks");

        const category = current.searchParams.get("categoryId");

        if (category) {
            url.searchParams.set("categoryId", category);
        }

        if (!id || id === "ALL") {
            url.searchParams.delete("status");
        } else {
            url.searchParams.set("status", id);
        }

        window.location.href = url.toString();
    }
    function filterStatusList(event) {
        const keyword = document.getElementById("statusSearch").value;

        const items = document.querySelectorAll(".status-item");

        items.forEach(item => {
            const text = item.getAttribute("data-name");

            const textNormalized = removeVietnameseTones(text);
            const keywordNormalized = removeVietnameseTones(keyword);

            if (textNormalized.includes(keywordNormalized)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });

        // ENTER
        if (event && event.key === "Enter") {
            event.preventDefault();

            if (!keyword) {
                window.location.href = "/staff/list-feedbacks";
                return;
            }

            const firstVisible = document.querySelector(
                "#statusDropdown .status-item:not([style*='display: none']):not([data-id='ALL'])"
            );

            if (firstVisible) {
                const id = firstVisible.getAttribute("data-id");
                const current = new URL(window.location.href);
                const categoryId = current.searchParams.get("categoryId");

                let url = "/staff/filter-feedbacks?status=" + id;

                if (categoryId) {
                    url += "&categoryId=" + categoryId;
                }

                window.location.href = url;
            }
        }
    }
</script>
<script>
    window.addEventListener("load", function () {

        const loading = document.getElementById("loadingRow");
        const table = document.getElementById("tableBody");

        setTimeout(() => {
            loading.style.display = "none";  // ẩn loading
            table.style.display = "";        // hiện data
        }, 500); // delay nhẹ cho mượt
    });
</script>
<script>
    let lastData = "";

    // 🔥 load bảng mượt
    function reloadTableSmooth() {
        fetch(window.location.href)
            .then(res => res.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const newTable = doc.querySelector("#tableBody");
                const currentTable = document.querySelector("#tableBody");

                if (!newTable || !currentTable) return;

                const newContent = newTable.innerHTML;

                // ✅ chỉ update khi có thay đổi
                if (newContent !== lastData) {

                    // fade nhẹ cho mượt
                    currentTable.style.opacity = "0";

                    setTimeout(() => {
                        currentTable.innerHTML = newContent;
                        currentTable.style.opacity = "1";
                    }, 150);

                    lastData = newContent;
                }
            });
    }

    // 🔥 chạy mỗi 5s
    setInterval(() => {
        if (!document.hidden) {
            reloadTableSmooth();
        }
    }, 5000);
</script>
</body>
</html>
