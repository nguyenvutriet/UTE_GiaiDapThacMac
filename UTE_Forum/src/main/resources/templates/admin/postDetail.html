<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài viết</title>
    <link rel="stylesheet" href="../../css/student/forumView.css" th:href="@{/css/student/forumView.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        @keyframes commentPulse {
            0%   { background: #fff3cd; box-shadow: 0 0 0 3px #f59e0b; }
            65%  { background: #fff3cd; box-shadow: 0 0 0 3px #f59e0b; }
            100% { background: transparent; box-shadow: none; }
        }

        .comment-highlight {
            animation: commentPulse 3s ease forwards;
            border-radius: 14px;
        }
    </style>
    <style>
        @keyframes fbCommentHighlight {
            0% {
                background: #fff7cc;
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.00);
            }
            20% {
                background: #fff3a3;
                box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.28);
            }
            60% {
                background: #fff8d6;
                box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.16);
            }
            100% {
                box-shadow: none;
            }
        }

        .comment-bubble.comment-highlight {
            animation: fbCommentHighlight 3s ease forwards;
            border-radius: 20px;
        }
        .admin-comment-actions {
            display: inline-flex;
            gap: 10px;
            margin-top: 6px;
            padding-top: 5px;
            border-top: 1px solid #eee;
        }

        .btn-admin-hide {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #e11d48;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: opacity 0.15s;
        }

        .btn-admin-hide:hover {
            opacity: 0.75;
        }

        .comment-hidden-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #94a3b8;
            font-style: italic;
        }

        #adminToast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1e293b;
            color: #fff;
            padding: 11px 20px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 99999;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
        }

        #adminToast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>

</head>
<body>
<div class="page-layout">
    <aside class="sidebar">
        <link rel="icon" type="image/png" th:href="@{/images/ute_logo.png}" href="/images/ute_logo.png">
        <div class="brand-block">
            <img class="brand-logo" th:src="@{/images/ute_logo.png}" alt="UTE Logo">
            <div class="student-info">
                <img th:src="@{/images/student.png}" alt="avatar" class="avatar">
                <div>
                    <p class="student-name" th:text="${user.fullName}">Tên Admin</p>
                    <p class="student-id" th:text="'Mã quản trị: ' + ${user.id}">Mã quản trị</p>
                    <p class="student-role">Quản trị viên hệ thống</p>
                </div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="/admin/feedbacks"><span class="nav-icon">&#9998;</span><span>Góp ý tiếp nhận</span></a>
            <a class="nav-item" href="/admin/reports"><span class="nav-icon">&#128683;</span><span>Quản lý bình luận vi phạm</span></a>
            <a class="nav-item" href="/admin/category"><span class="nav-icon">&#9783;</span><span>Quản lý danh mục</span></a>
            <a class="nav-item active" href="/admin/forum/view"><span class="nav-icon">&#128172;</span><span>Diễn đàn</span></a>
            <a class="nav-item" th:href="@{/admin/notifications}"><span class="nav-icon">&#128276;</span><span>Thông báo</span><span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span></a>
            <a class="nav-item" href="/change-password"><span class="nav-icon">&#128273;</span><span>Đổi mật khẩu</span></a>
        </nav>
        <a class="logout-btn" href="/logout">Đăng xuất</a>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="main-header-top"><p class="school-title">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</p></div>

            <div class="main-header-bottom"><h1 class="page-tab">DIỄN ĐÀN</h1></div>
        </header>

        <section class="forum-container">
            <div class="post-list">
                <article class="post-card" th:if="${post != null}">
                    <div>
                        <div class="post-header">
                            <div class="user-meta">
                                <img th:src="@{/images/student.png}" class="post-avatar">
                                <div class="user-info">
                                    <b class="user-name" th:text="${post.userName}">Tên</b>
                                    <time class="post-date display-date-text" th:text="${#temporals.format(post.date, 'dd/MM/yyyy HH:mm')}">Ngày</time>
                                </div>
                            </div>
                        </div>
                        <div class="post-content">
                            <h3 class="post-title" th:text="${post.subject}">Tiêu đề</h3>
                            <p class="post-text" th:text="${post.description}">Nội dung...</p>
                        </div>

                        <div class="post-attachments" th:if="${not #lists.isEmpty(post.attachments)}">
                            <div class="post-image-grid">
                                <a class="post-image-link" th:each="file : ${post.attachments}"
                                   th:if="${(file.fileType != null and #strings.startsWith(file.fileType, 'image/')) or (file.fileName != null and #strings.endsWith(#strings.toLowerCase(file.fileName), '.jpg'))}"
                                   th:href="${file.fileUrl}" target="_blank">
                                    <img class="post-image-item" th:src="${file.fileUrl}" th:alt="${file.fileName}" />
                                </a>
                            </div>
                            <ul class="post-file-list">
                                <li th:each="file : ${post.attachments}" th:if="${file.fileType != null and !#strings.startsWith(file.fileType, 'image/')}">
                                    <a th:href="${file.fileUrl}" th:text="${file.fileName}" target="_blank">attachment</a>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="post-tags">
                        <span class="tag dept-tag" th:text="${post.departmentName}">Phòng ban</span>
                        <span class="tag cat-tag" th:each="cat : ${post.categories}" th:text="${'#' + cat}">#Tag</span>
                    </div>

                    <div class="post-actions">
                        <div class="post-reaction-bar">
                            <button class="post-main-reaction-btn" th:data-id="${post.id}" th:data-current-reaction="${post.reactionType}">
                        <span class="reaction-content">
                            <span th:switch="${post.reactionType}">
                                <th:block th:case="'LIKE'">👍 Thích</th:block>
                                <th:block th:case="'LOVE'">❤️ Yêu thích</th:block>
                                <th:block th:case="'HAHA'">😆 Haha</th:block>
                                <th:block th:case="'WOW'">😮 Wow</th:block>
                                <th:block th:case="'SAD'">😢 Buồn</th:block>
                                <th:block th:case="'ANGRY'">😡 Phẫn nộ</th:block>
                                <th:block th:case="*">👍 Thích</th:block>
                            </span>
                        </span>
                            </button>
                            <div class="post-reaction-box">
                                <button class="post-reaction-btn" data-type="LIKE">👍</button>
                                <button class="post-reaction-btn" data-type="LOVE">❤️</button>
                                <button class="post-reaction-btn" data-type="HAHA">😆</button>
                                <button class="post-reaction-btn" data-type="WOW">😮</button>
                                <button class="post-reaction-btn" data-type="SAD">😢</button>
                                <button class="post-reaction-btn" data-type="ANGRY">😡</button>
                            </div>
                        </div>

                        <button type="button" class="post-main-reaction-btnn btn-show-reactions" th:data-post-id="${post.id}">
                            <div class="reaction-icons-stack">
                                <span th:each="icon : ${post.topReactionIcons}" class="mini-icon" th:text="${icon}"></span>
                            </div>
                            <span class="reaction-count js-reaction-count" th:text="${post.totalReactions > 0 ? post.totalReactions : ''}"></span>
                        </button>

                        <button class="action-btn">
                            💬 <span th:text="${post.commentCount + ' Bình luận'}">0 Bình luận</span>
                        </button>
                    </div>

                    <div class="comment-section-wrapper" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                        <h4 style="font-size: 1.1rem; margin-bottom: 15px;">
                            Bình luận (<span th:id="|cmt-count-${post.id}|" th:text="${post.commentCount}">0</span>)
                        </h4>

                        <div th:id="|comment-list-${post.id}|" class="comment-list-container">
                        </div>

                        <div class="comment-input-area" style="display: flex; gap: 10px; margin-top: 20px;">
                            <img th:src="@{/images/student.png}" class="mini-avatar" style="width:35px; height:35px; border-radius:50%;">
                            <div style="flex:1; display:flex; background:#f0f2f5; border-radius:25px; padding: 5px 15px; align-items: center;">
                                <input type="text" th:id="|input-cmt-${post.id}|" placeholder="Viết bình luận công khai..." style="flex:1; border:none; background:transparent; outline:none;">
                                <button type="button" th:data-post-id="${post.id}" onclick="sendComment(this.getAttribute('data-post-id'))" style="border:none; background:none; color:#00558b; cursor:pointer; padding: 5px;">
                                    <i class="fas fa-paper-plane" style="font-size: 1.2rem;"></i>
                                </button>
                            </div>
                        </div>
                    </div>


                </article>
            </div>
        </section>
    </main>
</div>


<script th:inline="javascript">
    // Lấy dữ liệu bình luận từ Server gửi sang qua Thymeleaf biến thành biến JS
    function formatDirectDate(dateSource) {
        if (!dateSource) return "Vừa xong";

        // Tạo đối tượng ngày tháng từ dữ liệu server gửi về
        const d = new Date(dateSource);

        // Kiểm tra nếu ngày tháng không hợp lệ
        if (isNaN(d.getTime())) return "Vừa xong";

        const now = new Date();
        const diffInSeconds = Math.floor((now - d) / 1000);

        // Nếu mới bình luận trong vòng 1 phút
        if (diffInSeconds < 60) return "Vừa xong";

        // Nếu trong ngày hôm nay thì hiện giờ : phút
        if (d.toDateString() === now.toDateString()) {
            return d.getHours().toString().padStart(2, '0') + ":" +
                d.getMinutes().toString().padStart(2, '0');
        }

        // Nếu khác ngày thì hiện Ngày/Tháng
        return d.getDate().toString().padStart(2, '0') + "/" +
            (d.getMonth() + 1).toString().padStart(2, '0');
    }
    const initialComments = /*[[${post.comments}]]*/ [];

    document.addEventListener("DOMContentLoaded", function() {
        // Lấy danh sách comment từ Thymeleaf
        let comments = /*[[${post.comments}]]*/ [];
        const postId = [[${post.id}]];
        const container = document.getElementById(`comment-list-${postId}`);

        if (comments && container) {
            container.innerHTML = '';

            // --- BẮT ĐẦU LOGIC SẮP XẾP ---
            comments.sort((a, b) => {
                const rolesPriority = ['ROLE_ADMIN', 'ROLE_DEPARTMENT'];
                const aPriority = rolesPriority.includes(a.userRole) ? 1 : 0;
                const bPriority = rolesPriority.includes(b.userRole) ? 1 : 0;

                // Đưa ưu tiên (1) lên trước (0)
                return bPriority - aPriority;
            });
            // --- KẾT THÚC LOGIC SẮP XẾP ---

            comments.forEach(cmt => {
                if(cmt) {
                    container.insertAdjacentHTML('beforeend', renderCommentHTML(cmt));
                }
            });
        }
    });
    let activePostId = null;

    function renderCommentHTML(cmt) {

        const reactionData = {
            'LIKE': {text: 'Thích', color: '#0866ff', icon: '👍'},
            'LOVE': {text: 'Yêu thích', color: '#f33e58', icon: '❤️'},
            'HAHA': {text: 'Haha', color: '#f7b125', icon: '😆'},
            'WOW': {text: 'Wow', color: '#f7b125', icon: '😮'},
            'SAD': {text: 'Buồn', color: '#f7b125', icon: '😢'},
            'ANGRY': {text: 'Phẫn nộ', color: '#e9710f', icon: '😡'}
        };


        // Xác định vai trò
        const isAdmin = cmt.userRole === 'ROLE_ADMIN';
        const isDepartment = cmt.userRole === 'ROLE_DEPARTMENT';
        const isPriority = isAdmin || isDepartment;
        // Định nghĩa Style cho khung comment dựa trên vai trò
        // Nếu là Admin/Phòng ban: có viền hồng, nền hồng nhạt
        const commentBoxStyle = isPriority
            ? `border: 1px solid #ffebeb; background: #fffafa; padding: 10px 15px; border-radius: 20px; position: relative;`
            : `background: #f0f2f5; padding: 10px 15px; border-radius: 20px;`; // Style mặc định cho SV

        // Avatar mặc định: Icon mũ cử nhân
        const avatarHTML = `<div style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ddd; background: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;">
                        <i class="fas fa-graduation-cap" style="font-size: 18px; color: black;"></i>
                    </div>`;
        // 🔥 TEXT CỦA USER
        const reactConfig = reactionData[cmt.reactionType] || {
            text: "Thích",
            color: "#65676b",
            icon: ""
        };

        // 🔥 BUILD ICON + COUNT
        let iconsHTML = "";
        let totalCount = 0;

        if (cmt.reactions) {
            Object.entries(cmt.reactions).forEach(([key, value]) => {
                if (value > 0) {
                    iconsHTML += reactionData[key].icon + " ";
                    totalCount += value;
                }
            });
        }

        return `
<div class="comment-item" id="cmt-${cmt.id}" style="display:flex; gap:10px; margin-bottom:15px; align-items: flex-start; animation: zoomIn 0.3s ease;">
    <img src="/images/student.png" style="width:32px; height:32px; border-radius:50%;">
    <div style="max-width: 85%; flex: 1;">
        <div class="comment-bubble" style="${commentBoxStyle}">

        <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 4px;">
            <b style="font-size: 14px; color: ${isAdmin ? '#d32f2f' : '#00558b'};">${cmt.userName}</b>

            ${isPriority ? `
                <svg viewBox="0 0 16 16" width="14" height="14" style="flex-shrink: 0;">
                    <path fill="#1877F2" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0Zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05Z"/>
                </svg>
                <span style="font-size: 9px; padding: 2px 5px; border-radius: 4px; background: ${isAdmin ? '#d32f2f' : '#00558b'}; color: white; font-weight: bold; text-transform: uppercase;">
                    ${isAdmin ? 'ADMIN' : 'PHÒNG BAN'}
                </span>
            ` : ''}
        </div>

        <div class="comment-text-content" style="font-size:15px; color:#050505; line-height:1.4; margin-bottom:8px;">
            ${cmt.content}
        </div>

        <div style="display: flex; gap: 10px; align-items: center; border-top: 1px solid #f2f2f2; padding-top: 5px;">
            <div class="admin-comment-actions">
                ${cmt.canDelete ? `
                    <span onclick="deleteComment('${cmt.id}')"
                          style="cursor:pointer; color:#d32f2f; font-size:12px;">
                        <i class="fas fa-trash-alt"></i> Xóa
                    </span>
                ` : ''}

                ${cmt.isActive !== false ? `
                    <button class="btn-admin-hide"
                            onclick="adminHideComment('${cmt.id}')">
                        <i class="fas fa-eye-slash"></i> Ẩn bình luận
                    </button>
                ` : `
                    <span class="comment-hidden-badge">
                        <i class="fas fa-eye-slash"></i> Đã ẩn
                    </span>
                `}
            </div>
        </div>
    </div>

        <div class="comment-meta-row" style="padding-left:10px; margin-top:2px; display:flex; gap:12px; align-items: center; ${cmt.isActive === false ? 'opacity:0.65;' : ''}">
            <small style="color:#65676b; font-size:11px;">
                ${formatDirectDate(cmt.date)}
            </small>

            ${cmt.isActive !== false ? `
            <!-- REACTION -->
            <div class="reaction-container">
                <div class="reaction-box">
                    <span onclick="sendReaction('${cmt.id}', 'LIKE')">👍</span>
                    <span onclick="sendReaction('${cmt.id}', 'LOVE')">❤️</span>
                    <span onclick="sendReaction('${cmt.id}', 'HAHA')">😆</span>
                    <span onclick="sendReaction('${cmt.id}', 'WOW')">😮</span>
                    <span onclick="sendReaction('${cmt.id}', 'SAD')">😢</span>
                    <span onclick="sendReaction('${cmt.id}', 'ANGRY')">😡</span>
                </div>

                <small id="react-text-${cmt.id}"
                    style="color:${reactConfig.color}; font-weight:600; cursor:pointer;"
                    onclick="sendReaction('${cmt.id}', 'LIKE')">
                    ${reactConfig.text}
                </small>
            </div>

            <div id="reaction-count-container-${cmt.id}"
                 onclick="showReactionDetail('${cmt.id}')"
                 style="cursor:pointer; display:${totalCount > 0 ? 'flex' : 'none'}; align-items:center; gap:4px; background:#f0f2f5; padding:1px 6px; border-radius:10px;">
                <span id="reaction-icons-${cmt.id}" style="font-size:12px;">
                    ${iconsHTML}
                </span>
                <small id="reaction-count-${cmt.id}" style="color:#65676b; font-size:12px;">
                    ${totalCount}
                </small>
            </div>
            ` : ''}


        </div>
    </div>
</div>`;
    }

    // 1. TÍNH NĂNG XỔ BÌNH LUẬN TẠI CHỖ (TOGGLE)
    function toggleComments(requestId) {
        const commentBox = document.getElementById('comment-box-' + requestId);
        const commentList = document.getElementById('comment-list-' + requestId);
        if (!commentBox) return;

        const isOpening = !commentBox.classList.contains('show');
        if (isOpening) {
            commentBox.classList.add('show');
            commentList.innerHTML = '<p style="font-size:12px; color:gray; text-align:center; padding:10px;">Đang tải...</p>';

            fetch('/api/comments/' + requestId)
                .then(res => res.json())
                .then(data => {
                    commentList.innerHTML = '';
                    if (data.length === 0) {
                        commentList.innerHTML = '<p style="font-size:13px; color:gray; text-align:center; padding:10px;">Chưa có bình luận nào.</p>';
                    } else {
                        data.forEach(cmt => {
                            commentList.innerHTML += renderCommentHTML(cmt); // ĐÃ DÙNG HÀM RENDER XỊN
                        });
                    }
                })
                .catch(err => commentList.innerHTML = '<p style="color:red; font-size:12px;">Lỗi tải.</p>');
        } else {
            commentBox.classList.remove('show');
        }
    }

    function isImageAttachment(file) {
        if (!file) return false;

        const type = (file.fileType || '').toLowerCase();
        if (type.startsWith('image/')) return true;

        const fileName = (file.fileName || '').toLowerCase();
        const fileUrl = (file.fileUrl || '').toLowerCase();
        const imageExt = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'];

        return imageExt.some(ext => fileName.endsWith(ext) || fileUrl.endsWith(ext));
    }

    function renderModalAttachments(attachments) {
        if (!attachments || attachments.length === 0) {
            return '';
        }

        const imageLinks = [];
        const fileLinks = [];

        attachments.forEach(file => {
            if (!file || !file.fileUrl) return;

            const safeUrl = String(file.fileUrl).replace(/"/g, '%22').replace(/'/g, '%27');
            const safeName = String(file.fileName || 'attachment')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            const safeType = String(file.fileType || 'application/octet-stream')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            if (isImageAttachment(file)) {
                imageLinks.push(
                    `<a class="post-image-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer">` +
                    `<img class="post-image-item" src="${safeUrl}" alt="${safeName}" />` +
                    `</a>`
                );
            } else {
                fileLinks.push(
                    `<li><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeName}</a>` +
                    `<span> (${safeType})</span></li>`
                );
            }
        });

        if (imageLinks.length === 0 && fileLinks.length === 0) {
            return '';
        }

        return `<div class="post-attachments modal-attachments">` +
            (imageLinks.length ? `<div class="post-image-grid modal-image-grid">${imageLinks.join('')}</div>` : '') +
            (fileLinks.length ? `<ul class="post-file-list modal-file-list">${fileLinks.join('')}</ul>` : '') +
            `</div>`;
    }

    // 2. TÍNH NĂNG MỞ MODAL
    function openPostModal(post) {
        // 🔥 SỬA LỖI 1: Gán ID để các hàm sau nhận diện được bài viết đang mở
        activePostId = post.id;

        document.getElementById('modal-header-text').innerText = `Bài viết của ${post.userName}`;
        document.getElementById('detail-user-name').innerText = post.userName;

        // Lấy ngày tháng an toàn
        const postCard = event.currentTarget;
        const dateText = postCard ? postCard.querySelector('.display-date-text').innerText : "";
        document.getElementById('detail-post-date').innerText = dateText;
        document.getElementById('detail-subject').innerText = post.subject;
        document.getElementById('detail-description').innerText = post.description;

        const attachmentBox = document.getElementById('detail-attachments');
        if (attachmentBox) {
            attachmentBox.innerHTML = renderModalAttachments(post.attachments || []);
        }

        const commentList = document.getElementById('modal-comment-list');
        commentList.innerHTML = '<p style="text-align:center; color:gray;">Đang tải...</p>';

        fetch('/api/comments/' + post.id)
            .then(res => res.json())
            .then(data => {
                commentList.innerHTML = '';
                // Khởi tạo thẻ span để hàm update số lượng tìm thấy được
                const countHeader = document.querySelector('.modal-comments-area h4');

    // 3. HÀM GỬI BÌNH LUẬN DÙNG CHUNG (FIXED LOGIC)
    function executeSendComment(requestId, content, listElement, inputElement) {
        const payload = { requestId: String(requestId), content: content };

        fetch('/api/comments/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(res => {
                // Nếu Server trả về 401 (Chưa đăng nhập) hoặc 403 (Cấm)
                if (res.status === 401 || res.status === 403) {
                    alert("Bạn cần đăng nhập để thực hiện chức năng này!");
                    window.location.href = "/login";
                    return;
                }
                if (!res.ok) throw new Error("Gửi bình luận thất bại");
                return res.json();
            })
            .then(newCmt => {
                if (!newCmt) return;

                // Xóa thông báo "Chưa có bình luận" (Dùng class sẽ chuẩn hơn includes text)
                const emptyMsg = listElement.querySelector('.no-comment-message') ||
                    (listElement.innerText.includes("Chưa có bình luận") ? listElement : null);
                if (emptyMsg && emptyMsg === listElement) listElement.innerHTML = '';
                else if (emptyMsg) emptyMsg.remove();

                // Chèn comment mới vào danh sách hiện tại
                listElement.insertAdjacentHTML('beforeend', renderCommentHTML(newCmt));
                inputElement.value = '';

                // Cập nhật số lượng hiển thị ở bài viết ngoài danh sách chính
                updateCommentCountUI(requestId);

                // 🔥 Cập nhật đồng bộ giữa Modal và ngoài danh sách
                if (typeof activePostId !== 'undefined' && activePostId == requestId) {
                    updateModalCommentCountUI(); // Tăng số lượng trong Modal

                    // Nếu đang gửi ở danh sách ngoài mà Modal đang mở, chèn cmt vào Modal luôn
                    const modalList = document.getElementById('modal-comment-list');
                    if (modalList && listElement.id !== 'modal-comment-list') {
                        if (modalList.innerText.includes("Chưa có bình luận")) modalList.innerHTML = '';
                        modalList.insertAdjacentHTML('beforeend', renderCommentHTML(newCmt));
                    }
                }

                // Tự động cuộn xuống cuối nếu đang ở trong Modal
                if (listElement.id === 'modal-comment-list') {
                    const scrollBody = document.querySelector('.modal-scrollable-body');
                    if (scrollBody) scrollBody.scrollTop = scrollBody.scrollHeight;
                }
            })
            .catch(err => {
                console.error("Lỗi gửi bình luận:", err);
                alert("Có lỗi xảy ra, vui lòng thử lại sau.");
            });
    }

        let modalCountSpan = document.getElementById('modal-total-count');

    function deleteComment(commentId) {
        if (confirm("Bạn muốn xoá bình luận này?")) {
            // 1. Tìm thông tin bài viết (requestId) trước khi xóa
            const commentElement = document.getElementById(`cmt-${commentId}`);
            const parentList = commentElement ? commentElement.closest('.comment-list') : null;

            // Ưu tiên lấy requestId từ Modal nếu đang mở, nếu không thì lấy từ ID của list ngoài
            let requestId = (typeof activePostId !== 'undefined' && activePostId) ? activePostId : null;
            if (!requestId && parentList) {
                requestId = parentList.id.replace('comment-list-', '');
            }

            // 2. Gửi lệnh xóa lên Server
            fetch('/api/comments/delete/' + commentId, { method: 'DELETE' })
                .then(res => {
                    if (res.status === 401) { alert("Chưa đăng nhập nha má!"); window.location.href = "/login"; return; }
                    if (res.status === 403) { alert("Hông phải cmt của má, đừng xóa bậy!"); return; }
                    if (!res.ok) throw new Error("Lỗi server");
                    return res.text();
                })
                .then(msg => {
                    if (!msg) return;

                    // 🔥 BƯỚC 3: XÓA PHẦN TỬ TRÊN GIAO DIỆN (CẢ NGOÀI LẪN TRONG MODAL)
                    // Tìm tất cả các thẻ có ID này (vì cmt có thể xuất hiện ở 2 nơi cùng lúc)
                    const targets = document.querySelectorAll(`#cmt-${commentId}`);
                    targets.forEach(el => {
                        el.style.transition = 'all 0.3s ease';
                        el.style.transform = 'translateX(20px)'; // Hiệu ứng trượt nhẹ khi biến mất
                        el.style.opacity = '0';
                        setTimeout(() => el.remove(), 300);
                    });

                    // 🔥 BƯỚC 4: GỌI HÀM GIẢM SỐ LƯỢNG (CỦA MÁ ĐÃ CÓ)
                    if (requestId) {
                        // Đợi hiệu ứng xóa mờ dần một chút rồi mới giảm số cho đẹp
                        setTimeout(() => {
                            decreaseCommentCountUI(requestId);

                            // 🔥 KIỂM TRA TRẠNG THÁI DANH SÁCH TRỐNG (TRONG MODAL)
                            if (typeof activePostId !== 'undefined' && activePostId == requestId) {
                                const modalList = document.getElementById('modal-comment-list');
                                // Nếu sau khi xóa mà không còn con (children) nào, hiện thông báo trống
                                if (modalList && modalList.children.length === 0) {
                                    modalList.innerHTML = '<p class="text-center no-comment-message">Chưa có bình luận nào.</p>';
                                }
                            }
                        }, 350);
                    }
                })
                .catch(err => {
                    console.error("Lỗi:", err);
                    alert("Lỗi kết nối server rồi má ơi!");
                });
        }
    }

    function decreaseCommentCountUI(requestId) {

    function formatDirectDate(dateParam) {
        if (!dateParam) return "Vừa xong";
        if (typeof dateParam === 'object' && dateParam.year) {
            return `${String(dateParam.dayOfMonth).padStart(2, '0')}/${String(dateParam.monthValue).padStart(2, '0')}/${dateParam.year} ${String(dateParam.hour).padStart(2, '0')}:${String(dateParam.minute).padStart(2, '0')}`;
        }
        const date = new Date(dateParam);
        return isNaN(date) ? dateParam : date.toLocaleString('vi-VN');
    }

    async function sendReaction(commentId, type) {
        try {
            const res = await fetch(`/api/vote-comment/${commentId}?type=${type}`);

            // 🔥 BẢO MẬT: Kiểm tra nếu chưa đăng nhập
            if (res.status === 401) {
                alert("Đăng nhập đi má ơi, hông login sao mà thả tim được!");
                window.location.href = "/login";
                return;
            }

            if (!res.ok) throw new Error("Lỗi hệ thống");

            const data = await res.json();
            console.log("REACTION:", data); // debug

            const updateAll = (selector, cb) => {
                document.querySelectorAll(selector).forEach(cb);
            };

            // --- GIỮ NGUYÊN LOGIC UI CỦA MÁ TỪ ĐÂY XUỐNG ---
            if (data.voted && data.type && reactionData[data.type]) {
                const config = reactionData[data.type];
                updateAll(`#react-text-${commentId}`, el => {
                    el.innerText = config.text;
                    el.style.color = config.color;
                });
            } else {
                updateAll(`#react-text-${commentId}`, el => {
                    el.innerText = "Thích";
                    el.style.color = "#65676b";
                });
            }

            updateAll(`#reaction-icons-${commentId}`, el => {
                if (data.voted && data.type && reactionData[data.type]) {
                    el.innerText = reactionData[data.type].icon;
                } else { el.innerText = ""; }
            });

            updateAll(`#reaction-count-${commentId}`, el => {
                el.innerText = data.voteCount || 0;
            });

            updateAll(`#reaction-count-container-${commentId}`, el => {
                el.style.display = data.voteCount > 0 ? "flex" : "none";
            });
            // --- KẾT THÚC LOGIC UI ---

        } catch (err) {
            console.error("Lỗi reaction:", err);
        }
    }

    // 1. Định nghĩa bảng màu và chữ (Nhớ để ngoài hàm)
    const reactions = {
        LIKE:  { text: 'Thích', color: '#0566ff' },
        LOVE:  { text: 'Yêu thích', color: '#ed4956' },
        HAHA:  { text: 'Haha', color: '#f7b125' },
        WOW:   { text: 'Wow', color: '#f7b125' },
        SAD:   { text: 'Buồn', color: '#f7b125' },
        ANGRY: { text: 'Phẫn nộ', color: '#e9710f' }
    };

    // 2. Hàm gửi Reaction
    async function sendPostReaction(postId, type) {
        try {
            const res = await fetch(`/api/forum/react?postId=${postId}&type=${type}`, {
                method: 'POST'
            });

            if (res.status === 401) { alert("Đăng nhập đi má ơi!"); return; }
            if (!res.ok) {
                const errorData = await res.json();
                console.error("Lỗi từ server:", errorData);
                return;
            }

            const data = await res.json(); // Nhận { counts: {...}, currentType: "..." }
            const apiData = data.counts;
            const currentActive = data.currentType;

            const total = Object.values(apiData).reduce((a, b) => a + b, 0);

            // Cập nhật UI nút chính và cụm icon
            updateReactionUI(postId, currentActive, total);
            updateReactionUII(postId, apiData);

        } catch (err) {
            console.error('Lỗi kết nối:', err);
        }
    }

    // 3. Hàm cập nhật chữ và màu nút chính
    function updateReactionUI(postId, activeType, totalCount) {
        const btn = document.querySelector(`.post-main-reaction-btn[data-id='${postId}']`);
        if (!btn) return;

        const typeKey = (activeType && activeType !== "") ? activeType.toUpperCase() : "";
        const config = reactions[typeKey] || { text: 'Thích', color: '#65676b' };

        // Đổi chữ - Dùng innerHTML để dọn sạch th:switch của Thymeleaf
        const reactionContent = btn.querySelector('.reaction-content');
        if (reactionContent) {
            reactionContent.innerHTML = config.text;
        }

        // Đổi màu
        btn.style.setProperty('color', config.color, 'important');

        // Lưu lại trạng thái vào attribute
        btn.setAttribute('data-current-reaction', typeKey);
    }

    // 4. Hàm cập nhật cụm icon chồng nhau
    function updateReactionUII(postId, apiData) {
        const emojiMap = { LIKE: '👍', LOVE: '❤️', HAHA: '😆', WOW: '😮', SAD: '😢', ANGRY: '😡' };
        const sorted = Object.entries(apiData)
            .filter(([_, count]) => count > 0)
            .sort((a, b) => b[1] - a[1]);

        const topIcons = sorted.slice(0, 3).map(([type]) => emojiMap[type.toUpperCase()]);
        const total = Object.values(apiData).reduce((a, b) => a + b, 0);

        const btn = document.querySelector(`.btn-show-reactions[data-post-id="${postId}"]`);
        if (btn) {
            const stackDiv = btn.querySelector('.reaction-icons-stack');
            if (stackDiv) {
                stackDiv.innerHTML = topIcons.map(icon => `<span class="mini-icon">${icon}</span>`).join('');
            }
            const countSpan = btn.querySelector('.js-reaction-count');
            if (countSpan) {
                countSpan.textContent = total > 0 ? total : '';
            }
        }
    }


    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.post-reaction-bar').forEach(bar => {
            const mainBtn = bar.querySelector('.post-main-reaction-btn');
            const box = bar.querySelector('.post-reaction-box');
            let timeoutId;

            // --- BƯỚC QUAN TRỌNG: KHỞI TẠO MÀU SẮC KHI LOAD TRANG ---
            const postId = mainBtn.getAttribute('data-id');
            const currentType = mainBtn.getAttribute('data-current-reaction');
            // Gọi hàm update ngay lập tức để áp dụng màu từ Thymeleaf
            updateReactionUI(postId, currentType);
            // ------------------------------------------------------

            // Hiện/Ẩn Box
            const show = () => { clearTimeout(timeoutId); box.classList.add('show'); };
            const hide = () => { timeoutId = setTimeout(() => box.classList.remove('show'), 300); };
            mainBtn.addEventListener('mouseenter', show);
            mainBtn.addEventListener('mouseleave', hide);
            box.addEventListener('mouseenter', () => clearTimeout(timeoutId));
            box.addEventListener('mouseleave', hide);

            // Click icon trong box
            box.querySelectorAll('.post-reaction-btn').forEach(iconBtn => {
                iconBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const newType = iconBtn.getAttribute('data-type');
                    sendPostReaction(postId, newType);
                    box.classList.remove('show');
                });
            });

            // Click nút chính
            mainBtn.addEventListener('click', (e) => {
                if (box.classList.contains('show')) return;
                const cType = mainBtn.getAttribute('data-current-reaction');
                const typeToSend = (cType && cType !== "") ? cType : 'LIKE';
                sendPostReaction(postId, typeToSend);
            });
        });
    });

        });
    });

    async function showPostReactionDetail(postId) {
        if (!postId) return; // Chặn sớm nếu hông có ID

        try {
            const res = await fetch(`/api/forum/reactors/details?postId=${postId}`);

            // 🔥 BẢO MẬT: Nếu server báo chưa login
            if (res.status === 401) {
                alert("Má phải đăng nhập mới coi được chi tiết nha!");
                window.location.href = "/login";
                return;
            }

            if (!res.ok) throw new Error("Lỗi fetch dữ liệu");

            const data = await res.json();

            // Kiểm tra xem có ai thả tim hông trước khi map dữ liệu
            if (!data || data.length === 0) {
                console.log("Bài này hông có ai thả tim hết.");
                return;
            }

            // 🔥 GIỮ NGUYÊN LOGIC FORMAT DỮ LIỆU CỦA MÁ
            const formattedData = data.map(u => ({
                type: u.type,
                userName: u.fullName,
                userId: u.userId,
                userRole: u.userRole
            }));

            // Gọi hàm render của má (nhớ check tên hàm renderReactionModall coi có dư chữ 'l' hông nha)
            renderReactionModall(formattedData);

        } catch (err) {
            console.error("Lỗi showPostReactionDetail:", err);
            alert("Hệ thống đang bận, má thử lại sau nha!");
        }
    }

    function renderReactionModall(list) {
        const reactionData = {
            LIKE: '👍',
            LOVE: '❤️',
            HAHA: '😆',
            WOW: '😮',
            SAD: '😢',
            ANGRY: '😡'
        };

        // Đã cập nhật class: reaction-modal -> post-reaction-modal để khớp CSS tránh ghi đè
        let html = `
    <div class="reaction-modal-overlay" onclick="closeReactionModal(event)">
        <div class="post-reaction-modal">
            <h3 class="reaction-title">Người bày tỏ cảm xúc</h3>
            <div class="reaction-list">
    `;

        if (list.length === 0) {
            html += `<div style="padding: 30px; text-align: center; color: #65676b;">Chưa có cảm xúc nào.</div>`;
        }

        list.forEach(u => {
            const isVerified = u.userRole && u.userRole !== 'ROLE_STUDENT';
            html += `
        <div class="reaction-user" style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 4px 8px;">
        <span style="font-size: 20px; min-width: 24px;">${reactionData[u.type] || '👍'}</span>

        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px;">
            <b style="font-size: 14px; color: #050505;">${u.userName}</b>

            ${isVerified ? `
                <svg viewBox="0 0 16 16" width="14" height="14" style="flex-shrink: 0;">
                    <path fill="#1877F2" d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0Zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05Z"/>
                </svg>` : ''}

            <small style="color: #65676b; font-size: 13px; margin-left: 2px;">@${u.userId}</small>
        </div>
    </div>
        `;
        });

        html += `
            </div>
        </div>
    </div>
    `;

        // Chèn modal vào cuối body
        document.body.insertAdjacentHTML("beforeend", html);
    }

    function closeReactionModal(e) {
        // Chỉ đóng khi click vào lớp nền overlay (bên ngoài khung trắng)
        if (e.target.classList.contains("reaction-modal-overlay")) {
            e.target.remove();
        }
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('adminToast');
        toast.textContent = msg;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }


    // Khi vừa load trang lần đầu cũng phải gọi nó
    document.addEventListener('DOMContentLoaded', initReactionEvents);
    function initReactionEvents() {
        document.querySelectorAll('.post-reaction-bar').forEach(bar => {
            const mainBtn = bar.querySelector('.post-main-reaction-btn');
            const box = bar.querySelector('.post-reaction-box');
            if (!mainBtn || !box) return;

            let timeoutId;
            const postId = mainBtn.getAttribute('data-id');
            const currentType = mainBtn.getAttribute('data-current-reaction');

            // Áp dụng màu sắc ngay lập tức (Để hiện màu Vàng cho Wow, Đỏ cho Love...)
            updateReactionUI(postId, currentType);

            // Hiện/Ẩn Box 6 icon
            const show = () => { clearTimeout(timeoutId); box.classList.add('show'); };
            const hide = () => { timeoutId = setTimeout(() => box.classList.remove('show'), 300); };

            mainBtn.addEventListener('mouseenter', show);
            mainBtn.addEventListener('mouseleave', hide);
            box.addEventListener('mouseenter', () => clearTimeout(timeoutId));
            box.addEventListener('mouseleave', hide);

            // Sự kiện click icon trong box
            box.querySelectorAll('.post-reaction-btn').forEach(iconBtn => {
                iconBtn.onclick = (e) => {
                    e.stopPropagation();
                    sendPostReaction(postId, iconBtn.getAttribute('data-type'));
                    box.classList.remove('show');
                };
            });

            // Sự kiện click nút chính (Like/Unlike)
            mainBtn.onclick = (e) => {
                if (box.classList.contains('show')) return;
                const cType = mainBtn.getAttribute('data-current-reaction');
                sendPostReaction(postId, (cType && cType !== "") ? cType : 'LIKE');
            };
        });
    }


</script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const deepLinkCommentId = /*[[${deepLinkCommentId}]]*/ null;
        if (!deepLinkCommentId) return;

        let retry = 0;
        const maxRetry = 30;

        const timer = setInterval(() => {
            const item = document.getElementById("cmt-" + deepLinkCommentId);

            if (item) {
                clearInterval(timer);

                item.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                const bubble = item.querySelector(".comment-bubble");
                if (bubble) {
                    bubble.classList.remove("comment-highlight");
                    void bubble.offsetWidth;
                    bubble.classList.add("comment-highlight");
                }
            }

            retry++;
            if (retry >= maxRetry) {
                clearInterval(timer);
            }
        }, 250);
    });
</script>

<div id="adminToast"></div>
