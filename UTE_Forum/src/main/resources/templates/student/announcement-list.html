<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo</title>
    <link rel="stylesheet" href="../../css/student/announcementView.css" th:href="@{/css/student/announcementView.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="page-layout">
    <aside class="sidebar">
        <div class="brand-block">
            <img class="brand-logo" th:src="@{/images/ute_logo.png}" alt="UTE Logo">
            <div class="student-info">
                <img th:src="@{/images/student.png}" alt="avatar" class="avatar">
                <div>
                    <p class="student-name" th:text="${user.fullName}">Nguyễn Văn An</p>
                    <p class="student-id" th:text="'MSSV: ' + ${user.id}">MSSV: U_STU_10</p>
                    <p class="student-role" th:text="${user.role == 'ROLE_STUDENT' ? 'Sinh viên' : 'Giảng viên'}">Sinh viên</p>
                </div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" th:href="@{/api/history}"><span class="nav-icon">&#8635;</span><span>Lịch sử góp ý</span></a>
            <a class="nav-item" th:href="@{/api/submit}"><span class="nav-icon">&#9998;</span><span>Gửi góp ý</span></a>
            <a class="nav-item active" th:href="@{/api/forum/view}"><span class="nav-icon">&#9783;</span><span>Diễn đàn</span></a>
            <a class="nav-item" href="#"><span class="nav-icon">&#128276;</span><span>Thông báo</span></a>
            <a class="nav-item" href="/change-password"><span class="nav-icon">&#128273;</span><span>Đổi mật khẩu</span></a>
        </nav>
        <a class="logout-btn" href="/logout">Đăng xuất</a>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="main-header-top"><p class="school-title">TRƯỜNG ĐẠI HỌC CÔNG NGHỆ KỸ THUẬT TP.HCM</p></div>
            <div class="forum-tabs">
                <button class="tab-item" onclick="window.location.href='/api/forum/view'">
                    Diễn đàn
                </button>
                <button class="tab-item active"> Thông báo</button>
            </div>
            <div class="main-header-bottom"><h1 class="page-tab">THÔNG BÁO</h1></div>
        </header>

        <section class="annoucement-container">
            <div class="announcement-wrapper" style="flex: 1; display: flex; flex-direction: column; min-width: 0;">

                <div id="announcement-list" class="announcement">
                    <div th:if="${#lists.isEmpty(announcements)}" class="empty-state" style="text-align: center; padding: 20px;">
                        <p>Không tìm thấy thông báo nào phù hợp.</p>
                    </div>

                    <div th:each="ann : ${announcements}" class="announcement-item"
                         th:onclick="|window.location.href='/detail/' + '${ann.id}'|"
                         style="cursor: pointer; border-bottom: 1px solid #eee; padding: 15px; transition: 0.3s;">

                        <h3 class="ann-title" th:text="${ann.title}" style="color: #d32f2f; margin-bottom: 8px;">Tiêu đề thông báo</h3>

                        <div class="ann-meta" style="font-size: 0.85em; color: #666; margin-bottom: 10px;">
            <span class="ann-date">
                <i class="far fa-calendar-alt"></i>
                <span th:text="${#temporals.format(ann.date, 'dd/MM/yyyy HH:mm')}">01/01/2024</span>
            </span>
                            <span class="ann-dept" style="margin-left: 15px;">
                <i class="fas fa-building"></i>
                <span th:text="${ann.user.department.name}">Tên khoa</span>
            </span>
                        </div>

                        <p class="ann-excerpt" th:text="${#strings.abbreviate(ann.content, 150)}" style="color: #333; line-height: 1.5;">
                            Nội dung tóm tắt...
                        </p>
                    </div>
                </div>

            </div>

            <aside class="forum-sidebar">


                <div class="sidebar-widget">
                    <h3>Bộ lọc</h3>
                    <form th:action="@{/filter}" method="get" class="filter-stack">



                        <select name="departmentId" id="filterDepartment">
                            <option value="">Tất cả khoa</option>
                            <th:block th:each="dept : ${departments}">
                                <option th:value="${dept.id}"
                                        th:text="${dept.name}"
                                        th:selected="${dept.id == param.departmentId}"></option>
                            </th:block>
                        </select>

                        <div class="date-range">
                            <label>Từ:</label>
                            <input type="datetime-local" name="startDate" th:value="${param.startDate}">
                            <label>Đến:</label>
                            <input type="datetime-local" name="endDate" th:value="${param.endDate}">
                        </div>

                        <select name="sort" id="filterSort">
                            <option value="newest" th:selected="${param.sort == 'newest'}">Mới nhất</option>
                            <option value="oldest" th:selected="${param.sort == 'oldest'}">Cũ nhất</option>
                        </select>

                        <button type="submit" class="btn-apply">Áp dụng lọc</button>

                        <a th:href="@{/filter}" class="btn-reset" style="text-decoration: none; text-align: center; display: block; margin-top: 10px;">Xóa lọc</a>
                    </form>
                </div>

            </aside>
        </section>
    </main>
</div>

<script th:inline="javascript">
    const pageSize = 5;
    const announcementList = document.getElementById('announcement-list');

    // Hàm này sẽ được gọi khi trang load hoặc khi bà bấm "Áp dụng lọc"
    async function loadAnnouncements(page = 0) {
        try {
            announcementList.innerHTML = '<div class="loading-state" style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i><p>Đang tải dữ liệu...</p></div>';

            // 1. Lấy giá trị từ các ô lọc (Department, Date, Sort)
            const deptId = document.getElementById('filterDepartment').value;
            const start = document.getElementsByName('startDate')[0].value;
            const end = document.getElementsByName('endDate')[0].value;
            const sort = document.getElementById('filterSort').value;

            // 2. Gộp params
            const params = new URLSearchParams({
                page: page,
                size: pageSize,
                departmentId: deptId,
                startDate: start,
                endDate: end,
                sort: sort
            });

            // 3. Gọi API (Dùng cái API bà đã viết ở AnnouncementController)
            const response = await fetch(`/api/announcement?${params.toString()}`);

            if (!response.ok) throw new Error("Lỗi kết nối");

            const data = await response.json();
            announcementList.innerHTML = '';

            if (!data.content || data.content.length === 0) {
                announcementList.innerHTML = '<p style="text-align:center; padding:20px;">Không tìm thấy thông báo nào phù hợp. 💨</p>';
                return;
            }

            // 4. Render danh sách thông báo
            data.content.forEach(ann => {
                const card = `
                <div class="announcement-item"
                     onclick="window.location.href='/detail/${ann.id}'"
                     style="cursor: pointer; border-bottom: 1px solid #eee; padding: 15px; transition: 0.3s;">

                    <h3 class="ann-title" style="color: #d32f2f; margin-bottom: 8px;">${ann.title}</h3>

                    <div class="ann-meta" style="font-size: 0.85em; color: #666; margin-bottom: 10px;">
                        <span class="ann-date"><i class="far fa-calendar-alt"></i> ${ann.date}</span>
                        <span class="ann-dept" style="margin-left: 15px;"><i class="fas fa-building"></i> ${ann.creatorName || 'Ban Quản Trị'}</span>
                    </div>

                    <p class="ann-excerpt" style="color: #333; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                        ${ann.content}
                    </p>
                </div>`;
                announcementList.insertAdjacentHTML('beforeend', card);
            });

        } catch (error) {
            console.error("Lỗi:", error);
            announcementList.innerHTML = '<p style="text-align:center; color:red;">Lỗi tải dữ liệu. Bà kiểm tra lại Backend nhen!</p>';
        }
    }

    // 5. Lắng nghe sự kiện gửi Form lọc
    document.querySelector('.filter-stack').addEventListener('submit', function(e) {
        e.preventDefault(); // Không cho load lại trang kiểu cũ
        loadAnnouncements(0);
    });

    // 6. Tự động load khi vừa mở trang
    document.addEventListener('DOMContentLoaded', () => loadAnnouncements(0));
</script>
</body>
</html>
