<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết thông báo</title>
    <link rel="stylesheet" th:href="@{/css/layout/dashboard-common.css}">
    <link rel="stylesheet" th:href="@{/css/student/notification.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="page-layout">
    <aside class="sidebar">
        <div class="brand-block">
            <img class="brand-logo" th:src="@{/images/ute_logo.png}" alt="UTE Logo">
            <div class="student-info">
                <img th:src="@{/images/st_avt.png}" alt="avatar" class="avatar">
                <div>
                    <p class="student-name" th:text="${user.fullName}">Nguyen Van An</p>
                    <p class="student-id" th:text="${'MSSV: ' + user.id}">MSSV: U_STU_10</p>
                    <p class="student-role" th:text="${roleLabel}">Sinh vien</p>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-item" th:href="@{/api/history}"><i class="fas fa-box-archive nav-icon"></i><span>Góp ý tiếp nhận</span></a>
            <a class="nav-item" th:href="@{/api/forum/view}"><i class="fas fa-comments nav-icon"></i><span>Diễn đàn</span></a>
            <a class="nav-item" th:href="@{/api/notifications(tab='forum')}"><i class="fas fa-list-check nav-icon"></i><span>Quản lý thông báo</span></a>
            <a class="nav-item active" th:href="@{/api/notifications}">
                <i class="fas fa-bell nav-icon"></i>
                <span>Thông báo</span>
                <span class="badge-count" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span>
            </a>
            <a class="nav-item" href="#"><i class="fas fa-chart-line nav-icon"></i><span>Thống kê</span></a>
            <a class="nav-item" th:href="@{/change-password}"><i class="fas fa-key nav-icon"></i><span>Đổi mật khẩu</span></a>
        </nav>

        <a class="logout-btn" th:href="@{/logout}"><i class="fas fa-right-from-bracket"></i> Đăng xuất</a>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <div class="main-header-top">
                <p class="school-title">TRUONG DAI HOC CONG NGHE KY THUAT TP.HCM</p>
            </div>
        </header>

        <section class="detail-panel">
            <a class="back-link" th:href="@{/api/notifications}">&larr; Quay lai danh sach thong bao</a>
            <h2 th:text="${item.title}">Thong bao</h2>
            <p class="detail-meta">
                <span th:text="${item.timeLabel}">Hom nay</span>
                <span> - </span>
                <span th:text="${item.read ? 'Da doc' : 'Chua doc'}">Da doc</span>
            </p>
            <p class="detail-content" th:text="${item.content}">Noi dung thong bao.</p>
        </section>
    </main>
</div>
</body>
</html>
